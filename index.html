<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yograce โยเกรซ — Great Days Start With Yograce</title>
<meta name="description" content="Yograce โยเกรซ โยเกิร์ตสมูทตี้ ปัตตานี สั่งเดลิเวอรี่ได้ทุกวัน">
<meta property="og:title" content="Yograce โยเกรซ">
<meta property="og:description" content="โยเกิร์ตสมูทตี้ ปัตตานี สั่งเดลิเวอรี่ได้เลย">
<meta property="og:image" content="https://yograceyogurt.com/assets/icon-512.png">
<link rel="icon" type="image/png" href="assets/icon-180.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--mint:#8BBFA8;--mint-d:#4F8F77;--mint-l:#E3F1EA;--navy:#2E3A6B;--cream:#FFF8EE;--ink:#22283F;--mute:#6B7280}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Prompt',system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px 32px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:240px;max-width:66%;height:auto;margin:8px 0 4px}
.tag{font-weight:600;color:var(--navy);margin-bottom:10px}
.lead{color:var(--mute);margin:0 0 28px;line-height:1.6}
.promo{background:var(--navy);color:#fff;border-radius:18px;padding:16px 18px;width:100%;margin-bottom:20px}
.promo b{display:block;font-size:20px;color:#B9F0D3}
.promo span{font-size:14px;opacity:.9}
.btn{display:block;width:100%;text-decoration:none;background:var(--mint-d);color:#fff;font-weight:600;font-size:18px;padding:16px;border-radius:16px;box-shadow:0 6px 18px rgba(79,143,119,.3)}
.btn:active{transform:translateY(1px)}
.area{margin-top:14px;font-size:13px;color:var(--mute)}
footer{margin-top:auto;padding-top:40px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/logo-square.png" alt="Yograce">
  <div class="tag">Great Days Start With Yograce</div>
  <p class="lead">โยเกิร์ตสมูทตี้สดใหม่ทุกแก้ว<br>ส่งถึงบ้านในตัวเมืองปัตตานี</p>
  <div class="promo" id="promo"><b>ส่งฟรี ไม่มีขั้นต่ำ</b><span>ถึง 30 พ.ย. 2569</span></div>
  <a class="btn" href="order/">🛵 สั่งเดลิเวอรี่</a>
  <div class="area">📍 เฉพาะตัวเมืองปัตตานี รัศมีไม่เกิน 5 กม.</div>
  <footer>© Yograce โยเกรซ · ปัตตานี</footer>
</main>
<script>
/* หลังหมดโปร เปลี่ยนแบนเนอร์เป็นเงื่อนไขส่งฟรี 3 แก้ว */
try {
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
  if (today > '2026-11-30') document.getElementById('promo').innerHTML = '<b>ส่งฟรี 3 แก้วขึ้นไป</b><span>ไม่ถึง 3 แก้ว ค่าส่ง 10 บาท</span>';
} catch (e) {}
</script>
</body>
</html>
