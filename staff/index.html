<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yograce หลังร้าน</title>
<link rel="icon" href="../assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mint:#8BBFA8;--mint-d:#4F8F77;--mint-l:#E3F1EA;--navy:#2E3A6B;--cream:#FFF8EE;--red:#E5484D;--ink:#22283F;--mute:#6B7280;--line:#E8E2D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;font-size:15px}
button,input,select{font-family:inherit}
input,select{font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header img{height:34px}
header .t{font-weight:600;color:var(--navy);font-size:15px}
.link{border:0;background:none;color:var(--mute);font-size:13px;padding:6px}
.hide{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.status{display:flex;align-items:center;gap:12px}
.status .tx{flex:1}
.status b{font-size:17px}
.status small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;line-height:1.4}
.on b{color:var(--mint-d)} .off b{color:var(--red)}
.sw{position:relative;width:58px;height:34px;flex:none;border:0;border-radius:999px;background:#D5D8DF;padding:0;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.yes{background:var(--mint-d)} .sw.yes::after{left:27px}
.sw:disabled{opacity:.5}
h2{font-size:17px;color:var(--navy);margin:22px 0 4px}
.hint{color:var(--mute);font-size:12.5px;margin:0 0 6px}
.it{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:8px}
.it.out{background:#F6F6F8}
.it .th{width:48px;height:58px;border-radius:10px;background:var(--mint-l);flex:none;overflow:hidden;display:grid;place-items:center;font-size:22px}
.it .th img{width:100%;height:100%;object-fit:cover}
.it .nm{flex:1;min-width:0;font-size:14px;line-height:1.3}
.it .nm b{display:block;font-weight:600}
.it .nm span{color:var(--mute);font-size:12.5px}
.it.out .nm b{color:var(--mute);text-decoration:line-through}
.tag{display:inline-block;font-size:10.5px;border-radius:6px;padding:0 6px;margin-left:4px;background:#E0E7FF;color:#3341A6;vertical-align:1px}
.tag.out{background:#FDECEC;color:#9B1C1C}
.ed{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--navy)}
.lab{font-size:10.5px;color:var(--mute);text-align:center;margin-top:2px}
.swc{display:flex;flex-direction:column;align-items:center}
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 35%)}
.btn{display:block;width:100%;max-width:528px;margin:0 auto;border:0;background:var(--navy);color:#fff;border-radius:16px;padding:14px;font-size:16px;font-weight:600}
.btn.mint{background:var(--mint-d)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #F3C2C4}
.btn.red.sure{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(20,24,40,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0;color:var(--navy);font-size:19px}
.lbl{font-weight:600;margin:14px 0 6px;font-size:14px;color:var(--navy)}
.lbl span{font-weight:400;color:var(--mute);font-size:12px}
input[type=text],input[type=number],input[type=password],select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--mint-d)}
.pic{display:flex;gap:12px;align-items:center}
.pic .pv{width:84px;height:104px;border-radius:12px;background:var(--mint-l);overflow:hidden;flex:none;display:grid;place-items:center;font-size:12px;color:var(--mute);text-align:center}
.pic .pv img{width:100%;height:100%;object-fit:cover}
.pic label{flex:1}
.chk{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:15px;background:#EEF1FF;border:1.5px solid #D6DCFF;border-radius:12px;padding:12px;color:var(--navy);font-weight:500}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--navy)}
.chk small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.err{background:#FDECEC;color:#9B1C1C;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;z-index:50;max-width:90%;text-align:center}
.login{max-width:340px;margin:12vh auto 0;text-align:center}
.login img{width:200px}
.login input{text-align:center;font-size:24px;letter-spacing:6px;margin:18px 0 12px}
.load{color:var(--mute);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <!-- เข้าสู่ระบบ -->
  <div class="login hide" id="vLogin">
    <img src="../assets/logo.png" alt="Yograce">
    <div style="color:var(--navy);font-weight:600;margin-top:10px">หลังร้าน · สำหรับพนักงาน</div>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN">
    <button class="btn" id="bLogin">เข้าสู่ระบบ</button>
    <div id="lerr"></div>
  </div>

  <!-- หน้าหลัก -->
  <div class="hide" id="vMain">
    <header><img src="../assets/logo.png" alt="Yograce"><span class="t">หลังร้าน</span><button class="link" id="bOut">ออกจากระบบ</button></header>
    <div class="card status" id="shop"></div>
    <h2>เมนู</h2>
    <p class="hint">ปิดสวิตช์ = เมนูหมด ลูกค้าจะเห็นคำว่า "หมด" และสั่งไม่ได้ · วันใหม่อย่าลืมเปิดคืน</p>
    <div id="menu"><div class="load">กำลังโหลด…</div></div>
  </div>
</div>
<div class="fab hide" id="fab"><button class="btn mint" id="bAdd">+ เพิ่มเมนูใหม่</button></div>
<div class="ov hide" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxtXfWHtOhZo-IklcFPlCDn8VeSzVX5uwA-uhcB6LArK6KhcjUqdvBRTD2gXcn_0CHq9g/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} } };
const imgUrl = (v, w) => !v ? '' : /^https?:/.test(v) ? v : 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(v) + '=w' + w;
let PIN = mem.get('yg_staff_pin') || '';
let V = null; // ข้อมูลล่าสุดจากระบบ

function call(op, extra){
  return fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: 'admin', pin: PIN, op }, extra || {})) })
    .then(r => r.json(), () => { throw new Error('เชื่อมต่อไม่ได้ กรุณาลองใหม่'); })
    .then(r => { if (!r.ok) throw new Error(r.error || 'ไม่สำเร็จ'); return r; });
}
let tt;
function toast(t){ let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.classList.remove('hide'); clearTimeout(tt); tt = setTimeout(() => el.classList.add('hide'), 2200); }

/* ---------- เข้าสู่ระบบ ---------- */
function showLogin(msg){
  $('#vMain').classList.add('hide'); $('#fab').classList.add('hide'); $('#vLogin').classList.remove('hide');
  $('#lerr').innerHTML = msg ? '<div class="err">' + esc(msg) + '</div>' : '';
  $('#pin').value = ''; $('#pin').focus();
}
$('#bLogin').onclick = () => {
  PIN = $('#pin').value.trim(); if (!PIN) return;
  $('#bLogin').disabled = true; $('#bLogin').textContent = 'กำลังตรวจ…';
  call('get').then(v => { mem.set('yg_staff_pin', PIN); start(v); })
    .catch(e => showLogin(e.message))
    .finally(() => { $('#bLogin').disabled = false; $('#bLogin').textContent = 'เข้าสู่ระบบ'; });
};
$('#pin').onkeydown = e => { if (e.key === 'Enter') $('#bLogin').click(); };
$('#bOut').onclick = () => { PIN = ''; mem.set('yg_staff_pin', null); showLogin(); };

function start(v){
  V = v; $('#vLogin').classList.add('hide'); $('#vMain').classList.remove('hide'); $('#fab').classList.remove('hide');
  render();
}

/* ---------- แสดงผล ---------- */
function render(){
  const open = !V.paused;
  $('#shop').className = 'card status ' + (open && V.inHours ? 'on' : 'off');
  $('#shop').innerHTML = `<div class="tx"><b>${!open ? '⛔ ปิดรับออเดอร์ชั่วคราว' : V.inHours ? '✅ เปิดรับออเดอร์อยู่' : '🌙 นอกเวลาเปิดรับ'}</b>
    <small>${!open ? 'ลูกค้าจะเห็น "ออเดอร์เต็มชั่วคราว" · เปิดสวิตช์เพื่อรับออเดอร์ต่อ' : 'เวลาเปิดรับปกติ ' + esc(V.hours) + ' น. · ปิดสวิตช์ถ้าออเดอร์ล้น'}</small></div>
    <div class="swc"><button class="sw ${open ? 'yes' : ''}" id="swShop" aria-label="รับออเดอร์"></button><div class="lab">${open ? 'รับ' : 'ปิด'}</div></div>`;
  $('#swShop').onclick = e => toggle(e.currentTarget, 'pause', { paused: open },
    open ? 'ปิดรับออเดอร์ชั่วคราวแล้ว' : 'เปิดรับออเดอร์แล้ว');
  $('#menu').innerHTML = V.menu.map(c => `<h2 style="font-size:15px;margin-top:18px">${c.icon} ${esc(c.name)}</h2>` +
    c.items.map(i => `<div class="it${i.soldOut ? ' out' : ''}">
      <div class="th">${i.img ? `<img loading="lazy" alt="" src="${imgUrl(i.img, 160)}" onerror="this.remove()">` : c.icon}</div>
      <div class="nm"><b>${esc(i.name)}${i.isNew ? '<span class="tag">ใหม่</span>' : ''}${i.soldOut ? '<span class="tag out">หมด</span>' : ''}</b><span>${i.price}.- · ${esc(i.en)}</span></div>
      <button class="ed" data-ed="${i.id}">แก้ไข</button>
      <div class="swc"><button class="sw ${i.soldOut ? '' : 'yes'}" data-so="${i.id}" aria-label="มีขาย"></button><div class="lab">${i.soldOut ? 'หมด' : 'ขาย'}</div></div>
    </div>`).join('')).join('');
}
$('#menu').onclick = e => {
  const so = e.target.closest('[data-so]'), ed = e.target.closest('[data-ed]');
  if (so) { const it = find(so.dataset.so); toggle(so, 'soldout', { id: it.id, soldOut: !it.soldOut }, it.soldOut ? '"' + it.name + '" กลับมาขายแล้ว' : '"' + it.name + '" ตั้งเป็นหมดแล้ว'); }
  if (ed) form(find(ed.dataset.ed));
};
const find = id => { for (const c of V.menu) for (const i of c.items) if (i.id === id) return Object.assign({ cat: c.cat }, i); };
function toggle(btn, op, extra, msg){
  btn.disabled = true;
  call(op, extra).then(v => { V = v; render(); toast(msg); })
    .catch(e => { btn.disabled = false; failed(e); });
}
function failed(e){ if (/PIN/.test(e.message)) showLogin(e.message); else toast('⚠️ ' + e.message); }

/* ---------- เพิ่ม/แก้ไขเมนู ---------- */
$('#bAdd').onclick = () => form(null);
let photo = null;
function form(it){
  photo = null;
  const isEdit = !!it;
  $('#sheet').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h3>${isEdit ? 'แก้ไขเมนู' : 'เพิ่มเมนูใหม่'}</h3><button class="link" id="fx" style="font-size:22px">✕</button></div>
    <div class="lbl">รูปเมนู <span>(${isEdit ? 'เลือกใหม่ถ้าต้องการเปลี่ยน' : 'ไม่บังคับ แต่แนะนำ'})</span></div>
    <div class="pic"><div class="pv" id="pv">${isEdit && it.img ? `<img src="${imgUrl(it.img, 300)}" alt="">` : 'ยังไม่มีรูป'}</div>
      <label class="btn ghost" style="text-align:center">📷 เลือกรูป<input type="file" id="fimg" accept="image/*" class="hide"></label></div>
    <div class="lbl">ชื่อเมนู (ไทย)</div><input type="text" id="fname" maxlength="60" value="${esc(isEdit ? it.name : 'โยเกิร์ต')}">
    <div class="lbl">ชื่ออังกฤษ <span>(ไม่บังคับ)</span></div><input type="text" id="fen" maxlength="60" value="${esc(isEdit ? it.en : '')}">
    <div class="lbl">ราคา (บาท)</div><input type="number" id="fprice" inputmode="numeric" min="1" max="9999" value="${isEdit ? it.price : ''}">
    <div class="lbl">หมวดเมนู</div>
    <label class="chk"><input type="checkbox" id="fnew" ${!isEdit || it.isNew ? 'checked' : ''}><span>✨ เมนูใหม่<small>โชว์ในหมวด "เมนูใหม่" ด้านบนสุด + ติดป้าย "ใหม่"</small></span></label>
    <div class="lbl" style="font-size:13px">และอยู่ในหมวดหลัก <span>${isEdit && !it.added ? '(เมนูเดิมของร้าน เปลี่ยนหมวดไม่ได้)' : '(เมื่อเลิกเป็นเมนูใหม่ จะอยู่หมวดนี้)'}</span></div>
    <select id="fcat" ${isEdit && !it.added ? 'disabled' : ''}>${V.cats.map(c => `<option value="${c.cat}" ${(isEdit ? it.cat : 'fruity') === c.cat ? 'selected' : ''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select>
    <div id="ferr"></div>
    <button class="btn" id="fsave" style="margin-top:16px">${isEdit ? 'บันทึก' : 'เพิ่มเมนู'}</button>
    ${isEdit ? '<button class="btn red" id="fdel" style="margin-top:10px">ลบเมนูนี้</button>' : ''}`;
  $('#ov').classList.remove('hide'); document.body.style.overflow = 'hidden';
  $('#fx').onclick = closeForm;
  $('#fimg').onchange = e => { const f = e.target.files[0]; if (!f) return;
    $('#pv').textContent = 'กำลังย่อรูป…';
    shrink(f).then(d => { photo = d; $('#pv').innerHTML = `<img src="${d}" alt="">`; })
      .catch(() => { $('#pv').textContent = 'เปิดรูปไม่ได้'; }); };
  $('#fsave').onclick = () => {
    const body = { name: $('#fname').value.trim(), en: $('#fen').value.trim(), price: Number($('#fprice').value),
      cat: $('#fcat').value, isNew: $('#fnew').checked, image: photo };
    const miss = [];
    if (!body.name || body.name === 'โยเกิร์ต') miss.push('ชื่อเมนู'); if (!(body.price > 0)) miss.push('ราคา');
    if (miss.length) { $('#ferr').innerHTML = '<div class="err">กรุณาใส่ ' + miss.join(' และ ') + '</div>'; return; }
    if (isEdit) body.id = it.id;
    const b = $('#fsave'); b.disabled = true; b.textContent = photo ? 'กำลังอัปโหลดรูป…' : 'กำลังบันทึก…';
    call(isEdit ? 'edit' : 'add', body).then(v => { V = v; render(); closeForm(); toast(isEdit ? 'บันทึกแล้ว' : 'เพิ่มเมนู "' + body.name + '" แล้ว'); })
      .catch(e => { b.disabled = false; b.textContent = 'ลองอีกครั้ง'; $('#ferr').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  };
  if (isEdit) $('#fdel').onclick = e => {
    const b = e.currentTarget;
    if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'กดอีกครั้งเพื่อยืนยันลบ "' + it.name + '"'; return; }
    b.disabled = true; b.textContent = 'กำลังลบ…';
    call('remove', { id: it.id }).then(v => { V = v; render(); closeForm(); toast('ลบ "' + it.name + '" แล้ว'); })
      .catch(err => { b.disabled = false; b.textContent = 'ลบเมนูนี้'; b.classList.remove('sure'); $('#ferr').innerHTML = '<div class="err">' + esc(err.message) + '</div>'; });
  };
}
function closeForm(){ $('#ov').classList.add('hide'); document.body.style.overflow = ''; }
$('#ov').onclick = e => { if (e.target.id === 'ov') closeForm(); };
/* ย่อรูปในมือถือก่อนอัปโหลด (ด้านยาวไม่เกิน 1080px) */
function shrink(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, 1080 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      ok(cv.toDataURL('image/jpeg', 0.85)); };
    img.onerror = () => { URL.revokeObjectURL(url); no(); };
    img.src = url;
  });
}

/* เปิดหน้า: ถ้าเคยใส่ PIN ไว้ เข้าเลย */
if (PIN) { $('#vMain').classList.remove('hide'); call('get').then(start).catch(e => showLogin(e.message)); }
else showLogin();
</script>
</body>
</html>
